# RAM Tracking External API paths, relative to RAM_API_BASE_URL.
# Match these to the endpoint list in RAM's Swagger documentation (Help Center -> APIs).
# Responses may be a JSON array or an object with an items/data/results array; common
# field names (vehicleId, registration, driverName, latitude, startTime...) are recognised.
vehicles: /vehicles
positions: /vehicles/positions     # latest position per vehicle
journeys: /journeys                # GET ?vehicleId=&from=<ISO>&to=<ISO>
