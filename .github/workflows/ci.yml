name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Parallel: one worker per CPU. --dist loadfile keeps every test file on one worker, in file order (tests/test_timezone.py's
      # leak/restore guard pair and module-scoped fixtures rely on that). -p no:cacheprovider: workers must not fight over .pytest_cache.
      - run: python -m pytest -q -n auto --dist loadfile -p no:cacheprovider
