<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis Sign In</title>
  <meta name="theme-color" content="#0a0d12">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hud.css">
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; position: relative; z-index: 1; }
    .card { width: min(380px, 100%); text-align: center; }
    .card input { width: 100%; margin: 18px 0 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); font-size: 17px; font-family: var(--ui); }
    .card .btn { width: 100%; padding: 12px; font-size: 16px; }
    .err { color: var(--crit); min-height: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="login">
    <form class="panel card" method="post" action="/login">
      <div class="brand" style="margin-top:6px">J.A.R.V.I.S.<small>SALTS FIRE AND SECURITY</small></div>
      <label for="pw" class="empty" style="display:block;margin-top:18px">Identify yourself, sir.</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
      <button class="btn go" type="submit">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("error")) document.getElementById("err").textContent = "That's not right. Try again.";
  </script>
</body>
</html>
