<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis Sign In</title>
  <meta name="theme-color" content="#060c1a">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/hud.css">
</head>
<body class="login-page">
  <main class="login">
    <div class="login-card">
      <div class="login-core"><canvas id="login-core" width="340" height="340" role="img" aria-label="Jarvis core"></canvas></div>
      <div class="brand">J.A.R.V.I.S.<small>SALTS FIRE AND SECURITY</small></div>
      <h1>Identify yourself</h1>
      <form method="post" action="/login">
        <label for="pw">Password</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="btn-signin" type="submit">Sign in</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </div>
  </main>
  <script src="/static/core.js"></script>
  <script>
    if (new URLSearchParams(location.search).has("error")) document.getElementById("err").textContent = "That's not right. Try again.";
    // The core idles on the sign-in page; it wakes up (listening) while a password is being typed.
    (function () {
      var pw = document.getElementById("pw"), typing = false;
      pw.addEventListener("input", function () { typing = pw.value.length > 0; });
      if (window.JarvisCore) JarvisCore.mount(document.getElementById("login-core"), {
        frame: function (t) { return { state: typing ? "listening" : "idle", level: typing ? 0.25 + 0.2 * Math.abs(Math.sin(t / 400)) : 0 }; }
      });
    })();
  </script>
</body>
</html>
