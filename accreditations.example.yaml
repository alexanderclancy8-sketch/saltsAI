# Accreditations register. Copy to data/accreditations.yaml (git-ignored) and fill in
# the real certificate numbers and dates - or tell Jarvis ("our CHAS renews on 14 March",
# "the YD71 SFS van's MOT is due 2 November", "the ladders are inspected again on 15 October").
# That works for the accreditations, vehicles and equipment sections below; every change waits for
# the owner's approval. Jarvis creates data/accreditations.yaml for you the first time you tell him a
# date, using this layout but NOT the placeholder entries in this file - everything here is example
# data (until the real file exists, the Alerts show it and Jarvis says so).
# Jarvis reminds you before each renewal/audit and builds the evidence pack.

accreditations:
  - scheme: BAFE SP203-1 (Fire Detection & Alarm Systems)
    certification_body: SSAIB
    certificate_number: "TBC"
    modules: [Design, Installation, Commissioning & Handover, Maintenance]
    renewal_date: 2027-03-31
    next_audit: 2026-11-15
    audit_type: annual surveillance audit + site/installation sampling
    evidence:
      - Quality manual / management system procedures (document control, reviews)
      - Competency matrix - designers, installers, commissioners, maintainers (FIA / equivalent)
      - Sample of recent projects with design certs, installation, commissioning & acceptance certificates
      - Maintenance records showing 6-monthly (5-7 month) service visits and variations recorded
      - Complaints log with corrective actions
      - Calibration records for test equipment (insulation / loop testers, detector testers, sound meters)
      - Subcontractor control and evaluation records
      - Insurance certificates (PL / EL / PI)
      - Management review and internal audit records

  - scheme: SSAIB (Security Systems - intruder / CCTV / access control)
    certification_body: SSAIB
    certificate_number: "TBC"
    renewal_date: 2027-03-31
    next_audit: 2026-11-15
    audit_type: annual surveillance audit incl. site inspections
    evidence:
      - Quality management system records (ISO 9001-based scheme requirements)
      - Staff screening files to BS 7858 for everyone with access to security information
      - Police URN records and false alarm management (NPCC policy)
      - Maintenance visits to PD 6662 / BS EN 50131 (twice-yearly where signalling to ARC)
      - Certificates of compliance issued for new systems
      - Complaints log, corrective actions, calibration, insurance

  - scheme: CHAS (Contractors Health & Safety Assessment Scheme)
    certification_body: CHAS
    certificate_number: "TBC"
    renewal_date: 2027-01-31
    audit_type: annual online questionnaire (SSIP)
    evidence:
      - Health & safety policy signed and dated within the last 12 months
      - Risk assessments and method statements (RAMS) for typical jobs
      - Training records - asbestos awareness, working at height, IPAF/PASMA, manual handling, first aid
      - Accident book and RIDDOR reporting procedure
      - COSHH assessments
      - Employers' liability (min £5m) and public liability insurance certificates
      - Competent person for H&S advice named
      - Environmental and equality policies
      - CDM 2015 arrangements

# Test equipment that needs calibration (auditors check this)
calibration:
