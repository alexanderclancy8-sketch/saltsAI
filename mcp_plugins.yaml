# Launch specs for Jarvis's optional MCP / plugin integrations. Reviewed by a human, changed only by pull request.
#
# The on/off switches live on the Settings page ("Plugins and MCP tools"), not here. This file says WHAT each
# plugin is allowed to be and to reach. jarvis/brain/plugins.py reads it and refuses to start anything that is:
#   - not pinned to an EXACT version (x.y.z) - "latest", ranges and blanks are all refused,
#   - launched with a command other than npx or uvx,
#   - (Browser Use / ThoughtProof) missing the extra safety fields marked REQUIRED below.
#
# NOTHING HERE HAS BEEN VERIFIED AGAINST npm / PyPI. Every `version` is deliberately blank: whoever turns a
# plugin on must look up the current release, read its changelog, put the exact version here and commit it.
# Until then the plugin is inert (Settings shows it as "on, but not active") - it never floats to "latest".
#
# Needs: `npx` (Node) or `uvx` (uv) on the PATH of the machine Jarvis runs on. The shipped Dockerfile
# (python:3.12-slim) has neither, so on Azure App Service these will not start until the image is extended.
# That is reported, not silently ignored.
#
# Servers are started with an EMPTY extra environment: no Jarvis settings, tokens or company credentials are
# handed to them.

context7:
  # Engineering agent only (self_improve / issue_fix), Max (Claude Agent SDK) backend only.
  # Reads current, version-specific library documentation. Read-only: it has no write tools.
  scope: engineering
  command: npx
  package: "@upstash/context7-mcp"
  version: ""                      # PIN ME: exact x.y.z from npm
  args: ["-y", "{spec}"]           # {spec} becomes package@version
  server_name: context7
  # Exactly these tools may be called; everything else the server might expose is denied.
  # Tool names are from memory of Context7's docs and unverified - a wrong name just means the tool is unusable.
  tools: ["resolve-library-id", "get-library-docs", "query-docs"]
  # What it can reach: Context7's hosted documentation index over the internet (library names and the question
  # asked are sent to it). It has no access to the repository checkout, Jarvis's data or any credential.

browser_use:
  # Conversational Jarvis only, Max backend only. READ-ONLY browsing; see jarvis/brain/plugins.py for the guard.
  # Off by default. The single setting that turns it on is `plugin_browser_use_enabled` (Settings > Plugins and MCP
  # tools > "Browser Use (read-only browsing)", or env PLUGIN_BROWSER_USE_ENABLED=true) - and even then it only starts
  # once this entry has a verified pinned version, tools, and a human-confirmed sandbox. Page content is untrusted
  # data: it can never trigger a tool or approve anything, and Browser Use can never buy anything.
  scope: chat
  command: uvx
  package: "browser-use"
  # PIN ME: exact x.y.z from PyPI. LEFT BLANK ON PURPOSE: the package name "browser-use" and any version could not be
  # verified against the PyPI registry when this was written (no registry access), and a version must never be
  # invented. Until a human checks https://pypi.org/project/browser-use/ , reads that release's changelog and its MCP
  # tool list, and commits the exact version here, Browser Use stays inert even if switched on.
  version: ""
  args: ["--from", "{spec}", "browser-use", "--mcp"]   # unverified invocation - check against the pinned release
  server_name: browser_use
  # REQUIRED. Only these tools are exposed, and only these can ever be called. List navigation/reading tools ONLY
  # (open a URL, read page text, screenshot). Never list click / fill / submit / select / script / upload / login /
  # cookie / download / agent tools: a click can submit a form, so anything that can change a page is not "reading".
  # Tool names depend on the pinned release, so they are left blank until verified. Blank = inert.
  readonly_tools: []
  # Typing tools (to type a number plate such as SA60 LTS into a dealer's search box). Same rules, plus the code only
  # lets them be given a UK number plate in one of its real formats (AB12 CDE, A123 BCD, ABC 123D, ABC 1234, 1234 ABC;
  # one optional space or hyphen) - any other text, such as a password or card number, any number or true/false, and any
  # whitespace or newline (which would act as Enter) is refused. Only element numbers (index) may be numeric. Left blank until verified against the pinned release. Note that no
  # click tool is allowed, so results must come from the page being loaded after typing (Enter) or by opening the
  # dealer's own search address with the plate in it (navigation is checked against the allowlist like any other).
  search_tools: []
  # Hard denials - enforced in jarvis/brain/plugins.py (the lists there are always applied; entries here only add).
  # A tool whose name contains one of these words is refused and stops Browser Use starting if it is listed.
  denied_tool_keywords: [login, signin, signup, register, password, credential, secret, token, cookie, storage,
                         checkout, cart, basket, payment, pay, purchase, buy, order, download, upload, script, eval,
                         exec, javascript, agent, submit, click]
  # Web addresses with one of these as a whole path segment are refused even on an allowed domain, as are file
  # addresses (.exe .zip .pdf .csv .xls(x) .doc(x) and similar - downloads are denied).
  # The code also refuses cart/basket/checkout/login/payment fragments inside any path segment (cart.php, shopping-cart,
  # add-to-cart), /buy, /reserve, /myaccount, any % escape, any .. path, any # part, and the executable/macro file types.
  # Queries are capped at 64 characters and 3 name=value pairs whose values are a plate or a short plain word.
  blocked_path_keywords: [login, signin, signon, signup, register, auth, oauth, account, myaccount, checkout, cart,
                          basket, payment, pay, order, download, buy, buynow, addtocart, reserve]
  # OPTIONAL, filled in when the version is pinned: the only argument names each listed tool may be given, e.g.
  #   tool_arguments: {open_url: [url]}
  # Any other argument name is refused. Without it, EVERY string in a call (any argument name, any depth) is searched for
  # anything that looks like a host, domain, IP or URL, and has to pass the allowlist.
  # The ONLY sites the browser may open (and their subdomains); everything else is blocked. The Settings page field
  # "Browser Use allowed domains" can narrow this list but never widen it. UK private plate dealers first, then
  # government and security-industry bodies. Government entries are SPECIFIC HOSTS, never the whole of gov.uk (that
  # would include signin.account.gov.uk, tax.service.gov.uk and council payment portals): www.gov.uk for guidance
  # and the DVLA Vehicle Enquiry Service for plate look-ups (the host names are unverified - confirm both before
  # relying on them). An entry also covers its subdomains, so keep entries as narrow as the use allows. Host names
  # must be plain ASCII: no ports, IP addresses or punycode are ever opened.
  allowed_domains: [plates4less.co.uk, nationalnumbers.co.uk, swiftreg.co.uk, regplates.com, platehunter.com,
                    yellowhite.co.uk, plates.vip, www.gov.uk, vehicleenquiry.service.gov.uk, bsigroup.com,
                    fia.uk.com, bafe.org.uk, nsi.org.uk, ssaib.org]
  # Sandbox requirements (documented, NOT enforced by code, which is why this stays false): the browser must run in a
  # throwaway, credential-free container/profile - no saved logins, cookies, extensions or company SSO, no access to
  # Jarvis's files or network, a fresh profile per run, and its own network egress allowlist matching allowed_domains
  # as a second wall. The code only checks tool names, typed text and the web address a call asks for, BEFORE it runs;
  # it never sees where a page redirected to afterwards (the hook gets no post-navigation address), so a redirect to
  # another host is stopped only by that sandbox network egress allowlist. The code cannot create that sandbox.
  # Set to true only once a human has confirmed the above; do not set it on the strength of this file alone.
  sandbox_confirmed: false
  # Hostnames containing any of these words are refused even if someone adds them to the allowed domains.
  blocked_host_keywords: [sage, bank, barclays, lloyds, hsbc, natwest, santander, monzo, starling, xero, quickbooks,
                          paypal, stripe, gocardless, payroll, salts-fsm, sharepoint, onedrive, outlook, office365]
  max_url_length: 256              # a ceiling in code too (256): this file can only lower it

fsm_test_browser:
  # FSM TEST BROWSER. A SEPARATE entry from browser_use above, which stays read-only and keeps salts-fsm on its blocked-host
  # list - nothing in this entry loosens it. This is the only place in Jarvis where click and typing tools are ever
  # permitted, and only for ONE host: the Salts FSM TEST deployment. Conversational Jarvis only (never a team session),
  # Max backend only (the API backend has no MCP). See FsmTestPolicy in jarvis/brain/plugins.py.
  #
  # OFF by default. Its own switch: `plugin_fsm_test_browser_enabled` (Settings > Plugins and MCP tools > "FSM TEST BROWSER",
  # owner-only, or env PLUGIN_FSM_TEST_BROWSER_ENABLED=true). Even switched on it stays INERT, and Settings shows "on but
  # inactive (reason)", until ALL of these are true:
  #   - `version` below is an exact x.y.z that a human looked up, and `package`, `command` and `args` are filled in,
  #   - `read_tools` lists at least the navigation/reading tools (click_tools / type_tools are optional),
  #   - `sandbox_confirmed` is true (a human confirmed the sandbox below - the code can't create one),
  #   - env FSM_TEST_BASE_URL is an https address AND env FSM_BASE_URL (production) is set and is a different host.
  # NOTHING HERE HAS BEEN VERIFIED AGAINST npm / PyPI. Package, version and tool names are blank on purpose and must never
  # be invented: look the release up, read its changelog and its tool list, and commit the exact values here.
  scope: chat
  backend: max
  command: npx                     # unverified: npx or uvx, whichever the pinned package needs
  package: ""                      # PIN ME: the browser MCP package (name unverified)
  version: ""                      # PIN ME: exact x.y.z. Blank = inert. Never "latest".
  args: ["-y", "{spec}"]           # {spec} becomes package@version (npx) or package==version (uvx); check for the release
  server_name: fsm_test_browser    # must differ from browser_use / context7 / jarvis (the code refuses a clash)
  # REQUIRED / OPTIONAL: only these tools are exposed and only these can ever be called; everything else the server might
  # offer is denied. Names depend on the pinned release, so they are blank until verified. Blank read_tools = inert.
  read_tools: []                   # open a URL, read page text / snapshot, screenshot
  click_tools: []                  # click. Permitted ONLY here, and only on the one test host (see below)
  type_tools: []                   # type into a field. Text may ONLY be a login slot, never free text (see below)
  # Tools whose name contains one of these words are refused and stop the plugin starting if listed. The list in code
  # (script, eval, exec, javascript, run code, download, upload, cookie, storage, agent, submit, pdf) always applies; entries
  # here only add.
  denied_tool_keywords: []
  # OPTIONAL, filled in when the version is pinned: the only argument names each listed tool may be given, e.g.
  #   tool_arguments: {navigate: [url], type: [ref, text]}
  # Anything else is refused. Without it, EVERY string in a call is still searched for hosts and has to pass the host guard.
  # Typed text: the model never types free text and never sees a login. A typing call may carry ONLY one of these slot
  # names, written exactly (double braces included), and the code swaps in the real value from the ENVIRONMENT just before
  # the call reaches the browser:
  #   {{FSM_TEST_OFFICE_USER}}  {{FSM_TEST_OFFICE_PASS}}  {{FSM_TEST_ENGINEER_USER}}  {{FSM_TEST_ENGINEER_PASS}}
  # The values are environment secrets (FSM_TEST_OFFICE_USER / _PASS, FSM_TEST_ENGINEER_USER / _PASS). They are not on the
  # Settings page, are never put in chat, logs, memory, the audit table or conversation history, and are scrubbed out of
  # what the browser returns. They must be THROWAWAY accounts on the test site - never a production login. Any other typed
  # text, boolean or number (except an element number) is refused. The argument shape is unverified: when pinning, check the
  # real typing tool's arguments fit (any argument that is not a slot, an element number or an address is refused).
  #
  # The ONE allowed host: the hostname of env FSM_TEST_BASE_URL - exact match, no subdomains, https only, no port. It is
  # HARD-REFUSED if it is, or sits next to (parent or child of), the hostname of the production FSM (FSM_BASE_URL), and if
  # FSM_BASE_URL isn't set the plugin doesn't start. Every other host - and the production FSM - is refused for every tool,
  # including clicks. The web address of a call is parsed strictly (ASCII hostnames only: no backslash, @, port, IP, %
  # escape or punycode; no .. paths, no file/download extensions; query strings of at most 64 characters made of short plain
  # values, so no open-redirect parameter can name another site).
  # Page content is untrusted DATA: it can never trigger another tool or approve anything (the hook can only deny, or fill
  # in a login slot), and nothing from the test site is passed to Sage, email, memory or production by this code.
  #
  # Audit: EVERY call (allowed or refused) is written to the `fsm_test_browser_log` table (time, tool, url, outcome, reason)
  # BEFORE it goes ahead; if the row can't be written the call is refused. Alex reads it by asking Jarvis for the "FSM test
  # browser log" (read-only tool `fsm_test_browser_log`). Typed text and logins are never recorded.
  #
  # SANDBOX REQUIREMENTS (documented, NOT enforced by code, which is why `sandbox_confirmed` stays false): the browser must
  # run on a THROWAWAY, CREDENTIAL-FREE, SEPARATE machine or GitHub Actions runner - not the Jarvis App Service container.
  # No saved logins, cookies, extensions or company SSO; no access to Jarvis's files, database, secrets or network; a fresh
  # profile per run; and a network EGRESS ALLOWLIST that permits ONLY the FSM TEST hostname. That egress allowlist is the
  # SECOND WALL: the PreToolUse hook sees only the call about to be made (tool and arguments), never where a click or a
  # redirect took the page, so a redirect or link off the test host can be stopped only by the sandbox's egress allowlist
  # failing to connect. The production FSM must be unreachable from the sandbox. Set `sandbox_confirmed` to true only once a
  # human has confirmed all of that; do not set it on the strength of this file alone.
  # NOTE: the shipped Dockerfile (python:3.12-slim) has NEITHER npx nor uvx, so the server cannot start on the current Azure
  # image anyway (reported as "isn't installed", never silently ignored). Running it needs the sandbox above, wired up by a
  # human; this repository does not do that.
  # Residual risk: updatedInput (how a slot becomes its value) is applied by the Claude Code runtime - verify with the pinned
  # versions that the value reaches the browser and is not written to Claude Code's own session files on the Jarvis host.
  sandbox_confirmed: false
  # Hostnames containing any of these words are refused even as the test host. (salts-fsm is deliberately NOT here: the
  # test site may legitimately contain it. The production host is excluded by comparison with FSM_BASE_URL instead.)
  blocked_host_keywords: [sage, bank, barclays, lloyds, hsbc, natwest, santander, monzo, starling, xero, quickbooks,
                          paypal, stripe, gocardless, payroll, sharepoint, onedrive, outlook, office365]
  max_url_length: 256              # a ceiling in code too (256): this file can only lower it

thoughtproof:
  # A local MCP server that judges a proposed action against the written mandates in mandates.yaml and answers
  # ALLOW or BLOCK. Runs as a child process on the same machine; nothing is sent anywhere by Jarvis except to it.
  command: npx
  package: ""                      # REQUIRED: the ThoughtProof MCP package. Unverified - confirm the name first.
  version: ""                      # PIN ME: exact x.y.z
  args: ["-y", "{spec}"]
  tool: ""                         # REQUIRED: name of its verify tool
  action_arg: "action"             # argument that receives the JSON description of the proposed action
  mandates_arg: "mandates"         # argument that receives the mandate rules from mandates.yaml
  timeout_s: 20
