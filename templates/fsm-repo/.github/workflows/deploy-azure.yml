# Copy into the Salts FSM repository as .github/workflows/deploy-azure.yml.
# Jarvis merges an approved fix and then either this workflow runs on the push to main,
# or Jarvis dispatches it by name (set FSM_DEPLOY_WORKFLOW=deploy-azure.yml).
# Replace the build step with the FSM's real build (npm / dotnet / pip...).
name: Deploy Salts FSM to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # --- build & test (edit for the FSM's stack) ---------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm test --if-present && npm run build --if-present
      # -----------------------------------------------------------------------
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
